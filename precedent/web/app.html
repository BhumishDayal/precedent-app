<html lang="en">

<title>Precedent</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.003 200); --rail: oklch(0.965 0.005 200); --surface: oklch(1 0 0); --sunken: oklch(0.97 0.004 200);
    --line: oklch(0.915 0.006 200); --line-strong: oklch(0.86 0.008 200);

    --accent: oklch(0.55 0.105 185); --accent-ink: oklch(0.42 0.09 185); --accent-soft: oklch(0.955 0.03 185); --on-accent: oklch(0.99 0 0);
    --danger: oklch(0.55 0.19 27); --danger-soft: oklch(0.96 0.03 27);

    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.17 0.008 220); --rail: oklch(0.155 0.008 220); --surface: oklch(0.205 0.009 220); --sunken: oklch(0.185 0.008 220);
      --line: oklch(0.28 0.01 220); --line-strong: oklch(0.34 0.012 220);
      --ink: oklch(0.95 0.005 220); --ink-2: oklch(0.78 0.01 220); --ink-3: oklch(0.65 0.012 220);
      --accent: oklch(0.74 0.115 185); --accent-ink: oklch(0.8 0.1 185); --accent-soft: oklch(0.27 0.04 185); --on-accent: oklch(0.2 0.03 190);
      --danger: oklch(0.7 0.16 25); --danger-soft: oklch(0.27 0.05 25);
      --warn: oklch(0.8 0.13 80); --warn-ink: oklch(0.84 0.12 80); --warn-soft: oklch(0.28 0.045 75);
      --ok: oklch(0.74 0.14 150); --ok-soft: oklch(0.27 0.04 150);
      --info: oklch(0.72 0.12 255); --info-soft: oklch(0.27 0.04 255);
      --shadow-sm: none; --shadow-pop: 0 6px 16px oklch(0 0 0 / 0.35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); font-feature-settings: "cv11";
         display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  a { color: inherit; }
  .mono { font-family: var(--mono); font-size: 0.92em; }
  .tnum { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { text-wrap: pretty; }
  svg.i { width: 16px; height: 16px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  nav { position: sticky; top: 0; height: 100vh; background: var(--rail); border-right: 1px solid var(--line); padding: 18px 12px;
        display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
  .brand .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
  .brand .mark svg { width: 14px; height: 14px; stroke-width: 2.5; }
  nav a { text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-ctl);
          color: var(--ink-2); font-weight: 500; transition: background-color 150ms ease, color 150ms ease; }
  nav a:hover { background: var(--sunken); color: var(--ink); }
  nav a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); outline: 1px solid var(--line); }
  nav a.on svg { color: var(--accent); }
  nav a.gear { margin-top: auto; color: var(--ink-3); font-size: 13px; }
  .topbar { position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 32px;
            background: color-mix(in oklch, var(--bg) 90%, transparent); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
  .crumbs { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; min-width: 0; }
  .crumbs a { text-decoration: none; color: var(--ink-2); } .crumbs a:hover { color: var(--ink); }
  .crumbs b { color: var(--ink); font-weight: 550; }
  .health { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); }
  .health + .live { margin-left: 0; }
  .stepper { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0; padding-top: 16px; border-top: 1px solid var(--line); }
  .step { position: relative; padding-top: 18px; font-size: 12px; color: var(--ink-3); min-width: 0; }
  .step::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 2px; background: var(--line); }
  .step:first-child::before { left: 6px; } .step:last-child::before { right: calc(100% - 6px); }
  .step i { position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong);
            transition: background-color 200ms ease, border-color 200ms ease; }
  .step.done::before { background: var(--accent); } .step.done i { background: var(--accent); border-color: var(--accent); }
  .step.now i { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .step.now { color: var(--ink); font-weight: 600; } .step.done { color: var(--ink-2); }
  .step b { display: block; font-weight: inherit; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  .step small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 550; color: var(--ink-3);
          height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }

  .live.poll i { background: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--ok) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  main { min-width: 0; }
  .page { padding: 28px 32px 64px; max-width: 1320px; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
  .page-head h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.015em; }
  .page-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
  .spacer { flex: 1; }
  .row { display: flex; align-items: center; gap: 10px; }
  .muted { color: var(--ink-2); } .faint { color: var(--ink-3); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-sm); min-width: 0; }
  .card > .hd { display: flex; align-items: center; gap: 8px; padding: 14px 18px 0; min-height: 28px; }
  .card > .hd h2 { font-size: 13.5px; font-weight: 600; }
  .card > .hd .sub { color: var(--ink-3); font-size: 12.5px; }
  .card > .bd { padding: 12px 18px 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  a.card { display: block; text-decoration: none; color: inherit; transition: border-color 150ms ease; }
  a.card:hover { border-color: var(--line-strong); }
  .tscroll { overflow-x: auto; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: var(--r-ctl); border: 1px solid transparent;
         background: var(--accent); color: var(--on-accent); font: 550 13.5px/1 var(--font); cursor: pointer; text-decoration: none; white-space: nowrap;
         transition-property: transform, background-color, border-color, color, opacity; transition-duration: 150ms; transition-timing-function: var(--ease-out); }
  .btn:hover { background: color-mix(in oklch, var(--accent) 88%, var(--ink)); }
  .btn:active { transform: scale(0.97); }
  :where(a, button, select, input, summary, [tabindex]):focus-visible { outline: 2px solid color-mix(in oklch, var(--accent) 65%, transparent); outline-offset: 2px; border-radius: 6px; }
  tr.click:focus-visible { outline: 2px solid color-mix(in oklch, var(--accent) 65%, transparent); outline-offset: -2px; }
  tr.click:focus-visible td { background: var(--sunken); }
  .gnode:focus { outline: none; } .gnode:focus-visible rect.bg { stroke: var(--accent); stroke-width: 2.5; }
  .linkbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--accent-ink); cursor: pointer; }
  .linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  select.field { cursor: pointer; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
  .btn.secondary:hover { background: var(--sunken); }
  .btn.ghost { background: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--sunken); color: var(--ink); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input.field { height: 34px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
                font: 400 13.5px var(--font); outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; min-width: 0; }
  input.field::placeholder { color: var(--ink-3); }
  input.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent); }
  .seg { display: inline-flex; padding: 2px; border-radius: var(--r-ctl); background: var(--sunken); border: 1px solid var(--line); }
  .seg button { border: 0; background: transparent; color: var(--ink-2); font: 550 12.5px var(--font); height: 26px; padding: 0 10px; border-radius: 6px; cursor: pointer;
                transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap;
          background: var(--sunken); color: var(--ink-2); border: 1px solid var(--line); transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.lg { height: 28px; padding: 0 12px; font-size: 13px; }
  .pill.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; }
  .pill.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink-3); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.danger { background: var(--danger); } .dot.off { background: var(--line-strong); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--ink-3); font-weight: 500; font-size: 12.5px; background: var(--sunken); }
  thead th:first-child { border-top-left-radius: var(--r-card); } thead th:last-child { border-top-right-radius: var(--r-card); }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; transition: background-color 120ms ease; }
  tr.click:hover td { background: var(--sunken); }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-3); padding: 28px 16px; text-align: center; }
  .skel { background: linear-gradient(90deg, var(--sunken), var(--line), var(--sunken)); background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; border-radius: 6px; height: 12px; }
  @keyframes sk { to { background-position: -200% 0; } }

  .verdict { padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 28px; align-items: start; }
  .verdict h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
  .verdict .lead { font-size: 15.5px; color: var(--ink-2); margin: 6px 0 0; max-width: 70ch; }
  .verdict .lead b { color: var(--ink); font-weight: 600; }
  .verdict .act { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .verdict .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--ink-3); font-size: 13px; margin-top: 14px; }
  .verdict .meta a { color: var(--ink-2); text-decoration: none; } .verdict .meta a:hover { color: var(--accent-ink); }
  .scope { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-top: 16px; border-top: 1px solid var(--line); }
  .scope .txt { color: var(--ink-2); font-size: 13.5px; } .scope .txt b { color: var(--ink); font-weight: 600; }
  details.why { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; }
  details.why summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 550; font-size: 13px; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary svg { transition: transform 200ms var(--ease-out); }
  details.why[open] summary svg { transform: rotate(180deg); }
  details.why[open] .why-grid { animation: enter 220ms var(--ease-out); }
  .why-grid { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px 18px; margin: 14px 0 4px; font-size: 13.5px; max-width: 920px; }
  .why-grid dt { color: var(--ink-3); } .why-grid dd { margin: 0; color: var(--ink); }
  .why-grid code { font-family: var(--mono); font-size: 12.5px; background: var(--sunken); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }
  .incident-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  .banner { display: none; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; font-weight: 550; margin-top: 16px; }
  .banner.on { display: flex; animation: enter 260ms var(--ease-out); }
  .banner.swap { background: var(--accent-soft); color: var(--accent-ink); } .banner.wait, .banner.unclear { background: var(--warn-soft); color: var(--warn-ink); }
  .banner.show { background: var(--info-soft); color: var(--info); }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .tl { list-style: none; margin: 0; padding: 6px 0 8px; position: relative; }
  .tl::before { content: ""; position: absolute; left: 31px; top: 18px; bottom: 18px; width: 1px; background: var(--line); }
  .tl li { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 8px 18px; }
  .tl li.new { animation: enter 280ms var(--ease-out); }
  .tl .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
  .tl .ico svg { width: 14px; height: 14px; }
  .tl .ico.accent { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
  .tl .ico.warn { color: var(--warn-ink); background: var(--warn-soft); border-color: transparent; }
  .tl .ico.info { color: var(--info); background: var(--info-soft); border-color: transparent; }
  .tl .ico.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
  .tl .txt { padding-top: 4px; color: var(--ink); min-width: 0; } .tl .txt small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 1px; }
  .tl time { padding-top: 5px; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .callbox { display: flex; align-items: center; gap: 12px; }
  .callbox .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--ink-2); flex: 0 0 auto; }
  .callbox .ico.live { background: var(--accent-soft); color: var(--accent-ink); animation: ring 1.6s var(--ease-out) infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 40%, transparent); } 80%, 100% { box-shadow: 0 0 0 8px transparent; } }
  .transcript { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; font-size: 13px; }
  .transcript .turn { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; animation: enter 220ms var(--ease-out); }
  .transcript .turn b { color: var(--ink-3); font-weight: 500; font-size: 12px; padding-top: 1px; }
  .chat { display: flex; flex-direction: column; height: 460px; }
  .chat .thread { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 18px; min-height: 0; position: relative; }
  .msg { flex-shrink: 0; max-width: 88%; max-height: 300px; overflow-y: auto; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word;
         font-size: 13px; line-height: 1.45; animation: enter 220ms var(--ease-out); }
  .msg.them { background: var(--sunken); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: var(--accent); color: var(--on-accent); align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 550; }
  .msg .ev { font-family: var(--mono); font-size: 12px; }
  .msg time { display: block; font-size: 11px; opacity: .7; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .chat .foot { border-top: 1px solid var(--line); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .chipbtn { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
             font: 500 12.5px var(--font); cursor: pointer; transition: border-color 150ms ease, color 150ms ease, transform 150ms var(--ease-out); }
  .chipbtn:hover { border-color: var(--accent); color: var(--accent-ink); } .chipbtn:active { transform: scale(0.96); }
  .compose { display: flex; gap: 8px; } .compose input { flex: 1; }
  .actrow { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); animation: enter 240ms var(--ease-out); }
  .actrow:last-child { border-bottom: 0; }
  .actrow .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--sunken); color: var(--ink-2); }
  .actrow .ico svg { width: 14px; height: 14px; }
  .actrow b { font-weight: 600; } .actrow p { margin: 1px 0 0; color: var(--ink-2); font-size: 13px; }

  @keyframes rowin { from { background: var(--accent-soft); } to { background: transparent; } }
  pre.raw { font: 12px/1.5 var(--mono); background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; word-break: break-word; margin: 0; }
